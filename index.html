<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis Alves - Contact</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #111318;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
  }

  .card {
    width: min(100%, 480px);
    height: 720px;
    background: #ffffff;
    border-radius: 28px;
    padding: 30px 34px 34px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.13);
    text-align: center;
    overflow: hidden;
  }

  /* Exact logo artwork taken from the supplied reference image. */
  .logo {
    display: block;
    width:175px;
    height: auto;
    margin: 0 auto 22px;
  }

  h1 {
    margin: 0;
    font-size: 40px;
    line-height: 1.05;
    font-weight: 500;
    letter-spacing: -2.4px;
  }

  .position {
    margin-top: 17px;
    color: #555a63;
    font-size: 17px;
    line-height: 1.1;
    font-weight: 400;
  }

  .divider {
    height: 1px;
    margin: 22px 0 14px;
    background: #dcdfe3;
  }

  .info {
    text-align: left;
  }

  .info-row {
    display: flex;
    align-items: center;
    min-height: 48px;
    gap: 20px;
  }

  .info-icon {
    flex: 0 0 48px;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #eef0f3;
  }

  .info-icon svg {
    width: 25px;
    height: 25px;
    stroke: #17191d;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .info-text {
    display: flex;
    align-items: baseline;
    min-width: 0;
    gap: 11px;
    font-size: 15px;
    line-height: 1.35;
  }

  .label {
    font-weight: 700;
    white-space: nowrap;
  }

  .value {
    font-weight: 400;
    overflow-wrap: anywhere;
  }

  .buttons-divider {
    margin-top: 14px;
    margin-bottom: 16px;
  }

  .button {
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    border: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-decoration: none;
    font-family: inherit;
    font-size: 21px;
    line-height: 1;
    font-weight: 700;
    cursor: pointer;
  }

  .button svg {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    stroke: currentColor;
    stroke-width: 2.1;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .call {
    background: #111416;
    color: #ffffff;
  }

  .save {
    background: #e7e9ed;
    color: #111416;
  }

  .website {
    background: #d00000;
    color: #ffffff;
  }

  @media (max-width: 620px) {
    body {
      padding: 16px 10px;
    }

    .card {
      width: min(100%, 430px);
      height: auto;
      max-height: calc(100vh - 20px);
      padding: 22px 20px 20px;
      border-radius: 24px;
      overflow: hidden;
    }

    .logo {
      width:175px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: -1px;
    }

    .position {
      font-size: 17px;
      margin-top: 8px;
    }

    .divider {
      margin: 16px 0 10px;
    }

    .info-row {
      gap: 10px;
      min-height: 40px;
    }

    .info-icon {
      flex-basis: 40px;
      width: 40px;
      height: 40px;
    }

    .info-icon svg {
      width: 21px;
      height: 21px;
    }

    .info-text {
      display: block;
      font-size: 14px;
      line-height: 1.2;
    }

    .label {
      margin-right: 5px;
    }

    .buttons-divider {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .button {
      min-height: 46px;
      margin-top: 8px;
      border-radius: 13px;
      font-size: 16px;
      gap: 12px;
    }

    .button svg {
      width: 24px;
      height: 24px;
      flex-basis: 24px;
    }
  }
</style>
</head>
